<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Image Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #image {
            width: 500px;
            height: 300px;
            border: 3px solid black;
            margin: 30px auto;

            display: flex;
            align-items: center;
            justify-content: center;

            background-size: cover;
            background-position: center;

            font-size: 20px;
        }

        .preview {
            width: 150px;
            height: 100px;
            object-fit: cover;
            margin: 10px;
            cursor: pointer;
        }

        .preview:focus {
            outline: 4px solid blue;
        }
    </style>
</head>

<body onload="tabFocus()">

    <h1>Interactive Image Gallery</h1>

    <div id="image">
        Di chuột qua hình ảnh bên dưới để hiển thị tại đây.
    </div>

    <div>

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
            alt="Beautiful mountain landscape"
            onmouseover="upDate(this)"
            onmouseleave="undo()"
            onfocus="upDate(this)"
            onblur="undo()"
        >

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
            alt="Beautiful tropical beach"
            onmouseover="upDate(this)"
            onmouseleave="undo()"
            onfocus="upDate(this)"
            onblur="undo()"
        >

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
            alt="Mountain lake surrounded by nature"
            onmouseover="upDate(this)"
            onmouseleave="undo()"
            onfocus="upDate(this)"
            onblur="undo()"
        >

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
            alt="Lake and mountains in the countryside"
            onmouseover="upDate(this)"
            onmouseleave="undo()"
            onfocus="upDate(this)"
            onblur="undo()"
        >

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1469474968028-56623f02e42e"
            alt="Green forest landscape"
            onmouseover="upDate(this)"
            onmouseleave="undo()"
            onfocus="upDate(this)"
            onblur="undo()"
        >

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
            alt="Beautiful sunset over the mountains"
            onmouseover="upDate(this)"
            onmouseleave="undo()"
            onfocus="upDate(this)"
            onblur="undo()"
        >

    </div>

    <script src="script.js"></script>

</body>

</html>
